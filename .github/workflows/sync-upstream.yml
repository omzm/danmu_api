name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch upstream
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge --no-ff --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)
          # 只有真正合入了上游新提交（产生了合并提交）时，才需要把
          # .github/workflows/ 恢复成 fork 自身的版本；若上游无更新
          # （Already up to date），HEAD 未变，此时 HEAD^1 并不指
          # 合并前的 fork 状态，盲目恢复会反向改动工作流文件导致推送
          # 被 GitHub 拒绝。
          # GITHUB_TOKEN 无法推送工作流文件（GitHub 不允许 GitHub App
          # 在没有 'workflows' 权限时创建/更新 workflow 文件，而该权限
          # 不在 workflow 的 permissions 可选范围内），所以同步时跳过
          # .github/workflows/，保留 fork 自身的工作流文件。
          if [ "$BEFORE" != "$AFTER" ]; then
            git checkout HEAD^1 -- .github/workflows/
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep fork workflow files unchanged"
            fi
          fi
          git push origin main
